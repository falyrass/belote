<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Belote</title>
<style>
:root {
  --bg: #0f172a; --bg-2: #1e293b; --bg-3: #334155;
  --text: #f1f5f9; --text-2: #94a3b8;
  --accent: #10b981; --accent-2: #34d399;
  --red: #ef4444; --gold: #fbbf24;
  --card-w: 96px; --card-h: 144px;
  --card-back-w: 64px; --card-back-h: 96px;
  --trick-offset: 85px;
  --hand-overlap: -32px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
#app { max-width: 1400px; margin: 0 auto; padding: 10px; height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 8px; }

.scores { display: flex; flex-direction: column; gap: 8px; padding: 10px; background: var(--bg-2); border-radius: 12px; }
.scores-row { display: flex; justify-content: center; gap: 40px; }
.score-team { font-size: 0.75em; color: var(--text-2); text-transform: uppercase; letter-spacing: 1px; text-align: center; }
.score-value { font-size: 1.8em; font-weight: 700; color: var(--accent-2); text-align: center; line-height: 1.1; }
.score-value.winning { color: var(--gold); text-shadow: 0 0 20px rgba(251,191,36,0.5); }

/* === LIVE POINTS : cumul en temps réel === */
.live-points {
  display: flex;
  justify-content: center;
  gap: 30px;
  padding: 8px 12px;
  background: rgba(15, 23, 42, 0.7);
  border-radius: 8px;
  border: 1px solid rgba(251, 191, 36, 0.25);
  animation: fadeIn 0.3s;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.live-team {
  display: flex;
  align-items: center;
  gap: 10px;
}
.live-team-name {
  color: var(--text-2);
  text-transform: uppercase;
  font-size: 0.72em;
  letter-spacing: 0.5px;
}
.live-team-pts {
  font-weight: 800;
  color: var(--accent-2);
  font-size: 1.2em;
  min-width: 32px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.live-team-pts.taker {
  color: var(--gold);
}
.live-vs {
  color: var(--text-2);
  font-size: 0.8em;
  opacity: 0.5;
}

.table { flex: 1; display: grid; grid-template-columns: 160px 1fr 160px; grid-template-rows: 130px 1fr 190px; gap: 10px; min-height: 0; }
.seat { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; min-height: 0; }
.seat-north { grid-column: 2; grid-row: 1; }
.seat-west  { grid-column: 1; grid-row: 2; }
.seat-east  { grid-column: 3; grid-row: 2; }
.seat-south { grid-column: 2; grid-row: 3; }

.seat-name { font-size: 0.75em; color: var(--text-2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
.seat-name.active { color: var(--accent-2); font-weight: 700; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

.hand-hidden { display: flex; gap: 2px; justify-content: center; align-items: center; }
.card-back { width: var(--card-back-w); height: var(--card-back-h); border-radius: 6px; background: linear-gradient(135deg, #1e40af, #1e3a8a); border: 2px solid #3b82f6; box-shadow: 0 2px 6px rgba(0,0,0,0.3); position: relative; flex-shrink: 0; }
.card-back::before { content: ''; position: absolute; inset: 3px; border: 1px solid rgba(255,255,255,0.2); border-radius: 3px; background: repeating-linear-gradient(45deg, transparent, transparent 3px, rgba(255,255,255,0.05) 3px, rgba(255,255,255,0.05) 6px); }

.seat-west .hand-hidden, .seat-east .hand-hidden { flex-direction: column; gap: 0; }
.seat-west .card-back, .seat-east .card-back { margin-top: -55px; }
.seat-west .card-back:first-child, .seat-east .card-back:first-child { margin-top: 0; }

.seat-north .hand-hidden { gap: 0; }
.seat-north .card-back { margin-left: -20px; }
.seat-north .card-back:first-child { margin-left: 0; }

.hand-visible {
  display: flex;
  gap: 0;
  justify-content: center;
  align-items: flex-end;
  padding: 8px 0;
  min-height: calc(var(--card-h) + 16px);
  width: 100%;
  flex-wrap: nowrap;
}
.hand-visible .card { margin-left: var(--hand-overlap); }
.hand-visible .card:first-child { margin-left: 0; }

/* ==================== CARTE ==================== */
.card {
  width: var(--card-w);
  height: var(--card-h);
  border-radius: 8px;
  background: #fdfdfd;
  color: #1e293b;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s, z-index 0s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.35), 0 0 0 1px rgba(0,0,0,0.08) inset;
  user-select: none;
  position: relative;
  flex-shrink: 0;
  touch-action: manipulation;
  overflow: hidden;
  font-family: 'Georgia', 'Times New Roman', serif;
}
.card.red { color: #c8102e; }
.card.playable:hover { transform: translateY(-12px); box-shadow: 0 10px 25px rgba(16,185,129,0.5), 0 0 0 1px rgba(0,0,0,0.08) inset; z-index: 20; }
.card.playable:active { transform: translateY(-6px) scale(0.98); }
.card.disabled { opacity: 0.35; cursor: not-allowed; }

.card-corner { position: absolute; display: flex; flex-direction: column; align-items: center; line-height: 0.85; pointer-events: none; }
.card-corner-tl { top: 5px; left: 6px; }
.card-corner-br { bottom: 5px; right: 6px; transform: rotate(180deg); }
.corner-rank { font-size: 22px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
.corner-suit { font-size: 18px; line-height: 1; margin-top: 2px; }
.card-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 40px; line-height: 1; opacity: 0.55; font-weight: 400; pointer-events: none; }

.trick-area { grid-column: 2; grid-row: 2; position: relative; min-height: 260px; min-width: 0; }
.trick-cards { position: absolute; inset: 0; }
.trick-card-wrap { position: absolute; top: 50%; left: 50%; transition: box-shadow 0.3s; }
.trick-card-wrap[data-player="0"] { transform: translate(-50%, calc(-50% + var(--trick-offset))); }
.trick-card-wrap[data-player="1"] { transform: translate(calc(-50% + var(--trick-offset)), -50%); }
.trick-card-wrap[data-player="2"] { transform: translate(-50%, calc(-50% - var(--trick-offset))); }
.trick-card-wrap[data-player="3"] { transform: translate(calc(-50% - var(--trick-offset)), -50%); }

.trick-card-anim { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.trick-card-wrap[data-player="0"] .trick-card-anim { flex-direction: column-reverse; }
.trick-card-owner { font-size: 0.75em; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
.trick-card-wrap.winner .card { box-shadow: 0 0 24px var(--gold), 0 0 0 3px var(--gold) inset; }
.trick-card-wrap.winner .trick-card-owner { color: var(--gold); font-weight: 700; }

.trick-card-wrap.just-played[data-player="0"] .trick-card-anim { animation: slideFromBottom 0.3s cubic-bezier(0.22, 1, 0.36, 1); }
.trick-card-wrap.just-played[data-player="1"] .trick-card-anim { animation: slideFromRight 0.3s cubic-bezier(0.22, 1, 0.36, 1); }
.trick-card-wrap.just-played[data-player="2"] .trick-card-anim { animation: slideFromTop 0.3s cubic-bezier(0.22, 1, 0.36, 1); }
.trick-card-wrap.just-played[data-player="3"] .trick-card-anim { animation: slideFromLeft 0.3s cubic-bezier(0.22, 1, 0.36, 1); }

@keyframes slideFromBottom { from { transform: translateY(180px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes slideFromTop    { from { transform: translateY(-180px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes slideFromLeft   { from { transform: translateX(-180px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes slideFromRight  { from { transform: translateX(180px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

.actions { padding: 10px; background: var(--bg-2); border-radius: 12px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; min-height: 70px; flex-shrink: 0; }
.btn { padding: 10px 18px; border: none; border-radius: 8px; background: var(--bg-3); color: var(--text); font-size: 0.95em; font-weight: 600; cursor: pointer; transition: all 0.15s; min-height: 44px; min-width: 44px; touch-action: manipulation; }
.btn:hover:not(:disabled) { background: #475569; transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(0); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #052e16; }
.btn-primary:hover { background: var(--accent-2); }
.btn-bid { min-width: 68px; font-size: 1em; }
.btn-bid.red { color: #ef4444; }
.btn-counter { background: #b45309; color: white; }
.btn-counter:hover:not(:disabled) { background: #d97706; }
.btn-surcounter { background: #7c2d12; color: white; }
.btn-surcounter:hover:not(:disabled) { background: #9a3412; }

.info-bar { padding: 8px 12px; background: var(--bg-2); border-radius: 8px; text-align: center; color: var(--text-2); font-size: 0.85em; flex-shrink: 0; }
.info-bar strong { color: var(--accent-2); }
.info-bar .bid-current { color: var(--gold); font-weight: 700; }
.info-bar .bid-counter { color: #f97316; font-weight: 700; }
.info-bar .bid-surcounter { color: #ef4444; font-weight: 700; }

.message { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); padding: 10px 20px; background: var(--bg-3); border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); animation: slideDown 0.3s; z-index: 1000; font-weight: 600; font-size: 0.9em; max-width: 90vw; text-align: center; }
@keyframes slideDown { from { opacity: 0; transform: translate(-50%, -20px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* === TOAST D'ACTION D'ENCHÈRE (positionné par joueur) === */
.bid-action-toast {
  position: fixed;
  padding: 10px 22px;
  background: linear-gradient(135deg, rgba(30, 41, 59, 0.98), rgba(15, 23, 42, 0.98));
  border: 2px solid rgba(251, 191, 36, 0.8);
  border-radius: 22px;
  z-index: 1500;
  font-weight: 800;
  font-size: 0.9em;
  color: var(--text);
  pointer-events: none;
  box-shadow: 0 4px 24px rgba(0,0,0,0.7), 0 0 20px rgba(251,191,36,0.3);
  animation: bidActionPop 0.2s ease-out;
  white-space: nowrap;
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}
@keyframes bidActionPop {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* === POSITIONS PAR JOUEUR === */
/* Sud (Vous) : au-dessus des cartes du bas */
.bid-action-toast[data-player="0"] {
  bottom: 210px;
  left: 50%;
  transform: translateX(-50%);
}
/* Est : à droite, au-dessus du siège */
.bid-action-toast[data-player="1"] {
  right: 60px;
  top: 30%;
  transform: translateY(-50%);
}
/* Nord : en haut, au-dessus du siège */
.bid-action-toast[data-player="2"] {
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
}
/* Ouest : à gauche, au-dessus du siège */
.bid-action-toast[data-player="3"] {
  left: 60px;
  top: 30%;
  transform: translateY(-50%);
}

/* Gros toast central (enchère validée) */
.bid-toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 24px 40px; background: linear-gradient(135deg, #1e293b, #334155); border: 3px solid var(--gold); border-radius: 18px; box-shadow: 0 0 40px rgba(251,191,36,0.5), 0 10px 40px rgba(0,0,0,0.7); z-index: 2000; font-weight: 800; font-size: 1.4em; color: var(--text); text-align: center; letter-spacing: 0.3px; animation: bidToastPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); pointer-events: none; max-width: 85vw; }
@keyframes bidToastPop { from { opacity: 0; transform: translate(-50%, -50%) scale(0.5); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
.bid-toast.fade-out { animation: bidToastFade 0.4s ease-out forwards; }
@keyframes bidToastFade { from { opacity: 1; transform: translate(-50%, -50%) scale(1); } to { opacity: 0; transform: translate(-50%, -50%) scale(1.1); } }

.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 500; padding: 20px; }
.overlay-content { background: var(--bg-2); padding: 30px 25px; border-radius: 16px; text-align: center; max-width: 480px; width: 100%; box-shadow: 0 4px 30px rgba(0,0,0,0.5); }
.overlay-content h2 { color: var(--accent-2); margin-bottom: 16px; font-size: 1.6em; }
.overlay-content .detail { margin: 8px 0; color: var(--text-2); font-size: 1em; }
.overlay-content .detail strong { color: var(--text); }
.overlay-content .btn { margin-top: 18px; padding: 12px 28px; font-size: 1em; }
.outcome-badge { font-size: 1.2em; font-weight: 800; margin: 10px 0; letter-spacing: 1px; }
.outcome-badge.capot { color: var(--gold); text-shadow: 0 0 20px rgba(251,191,36,0.6); }
.outcome-badge.dedans { color: var(--red); text-shadow: 0 0 20px rgba(239,68,68,0.6); }

/* ==================== TABLETTES ==================== */
@media (max-width: 900px) {
  :root { --card-w: 80px; --card-h: 120px; --card-back-w: 52px; --card-back-h: 78px; --trick-offset: 70px; --hand-overlap: -26px; }
  #app { padding: 8px; gap: 6px; }
  .scores-row { gap: 20px; }
  .score-value { font-size: 1.5em; }
  .table { grid-template-columns: 100px 1fr 100px; grid-template-rows: 110px 1fr 165px; gap: 8px; }
  .corner-rank { font-size: 18px; }
  .corner-suit { font-size: 15px; }
  .card-center { font-size: 34px; }
  .seat-west .card-back, .seat-east .card-back { margin-top: -46px; }
  .seat-north .card-back { margin-left: -18px; }
  .btn { padding: 9px 16px; font-size: 0.9em; }
  .btn-bid { min-width: 60px; }
  .trick-area { min-height: 230px; }
  .bid-action-toast[data-player="0"] { bottom: 180px; }
  .bid-action-toast[data-player="1"] { right: 40px; }
  .bid-action-toast[data-player="3"] { left: 40px; }
  .bid-action-toast[data-player="2"] { top: 15px; }
  .live-team-name { font-size: 0.68em; }
  .live-team-pts { font-size: 1.1em; }
}

/* ==================== MOBILES ==================== */
@media (max-width: 600px) {
  :root {
    --card-w: 46px; --card-h: 69px;
    --card-back-w: 34px; --card-back-h: 51px;
    --trick-offset: 46px;
    --hand-overlap: -10px;
  }
  #app { padding: 6px; gap: 5px; max-width: 100vw; }
  .scores-row { gap: 16px; }
  .scores { padding: 6px; border-radius: 8px; }
  .score-team { font-size: 0.65em; letter-spacing: 0.5px; }
  .score-value { font-size: 1.3em; }
  .table { grid-template-columns: 42px 1fr 42px; grid-template-rows: 85px 1fr 135px; gap: 4px; }
  .seat-name { font-size: 0.6em; letter-spacing: 0.5px; margin-bottom: 3px; }
  .seat-name.active { animation: none; }
  .seat-north .card-back { margin-left: -16px; }
  .seat-west .card-back, .seat-east .card-back { margin-top: -34px; }

  .hand-visible { width: 100%; margin: 0 auto; padding: 4px 0; min-height: calc(var(--card-h) + 8px); overflow: visible; }

  .card-corner-tl { top: 3px; left: 4px; }
  .card-corner-br { bottom: 3px; right: 4px; }
  .corner-rank { font-size: 13px; }
  .corner-suit { font-size: 11px; }
  .card-center { font-size: 22px; }

  .trick-area { min-height: 160px; }
  .trick-card-owner { font-size: 0.55em; }
  .actions { padding: 8px; gap: 6px; min-height: 60px; }
  .btn { padding: 10px 12px; font-size: 0.82em; min-height: 42px; border-radius: 8px; }
  .btn-bid { min-width: 54px; font-size: 0.95em; }
  .info-bar { font-size: 0.72em; padding: 6px 10px; }
  .message { font-size: 0.8em; padding: 8px 14px; top: 10px; }
  .bid-toast { font-size: 1em; padding: 16px 22px; border-width: 2px; }
  .overlay-content { padding: 24px 18px; }
  .overlay-content h2 { font-size: 1.35em; margin-bottom: 12px; }
  .overlay-content .detail { font-size: 0.9em; }
  .outcome-badge { font-size: 1.1em; }

  /* Live points mobile */
  .live-points { gap: 10px; padding: 5px 8px; }
  .live-team-name { font-size: 0.6em; }
  .live-team-pts { font-size: 1em; min-width: 26px; }

  /* Toast d'enchère mobile : positions ajustées */
  .bid-action-toast {
    font-size: 0.75em;
    padding: 7px 14px;
    border-width: 1.5px;
  }
  .bid-action-toast[data-player="0"] { bottom: 150px; }
  .bid-action-toast[data-player="1"] { right: 45px; top: 28%; }
  .bid-action-toast[data-player="2"] { top: 90px; }
  .bid-action-toast[data-player="3"] { left: 45px; top: 28%; }
}

/* ==================== TRÈS PETITS MOBILES ==================== */
@media (max-width: 380px) {
  :root {
    --card-w: 40px; --card-h: 60px;
    --card-back-w: 28px; --card-back-h: 42px;
    --trick-offset: 38px;
    --hand-overlap: -6px;
  }
  .table { grid-template-columns: 36px 1fr 36px; grid-template-rows: 78px 1fr 125px; }
  .seat-west .card-back, .seat-east .card-back { margin-top: -28px; }
  .btn { padding: 8px 10px; font-size: 0.75em; }
  .btn-bid { min-width: 46px; font-size: 0.85em; }
  .score-value { font-size: 1.15em; }
  .corner-rank { font-size: 12px; }
  .corner-suit { font-size: 10px; }
  .card-center { font-size: 20px; }
  .bid-action-toast[data-player="0"] { bottom: 135px; }
  .bid-action-toast[data-player="2"] { top: 80px; }
  .bid-action-toast[data-player="1"] { right: 35px; }
  .bid-action-toast[data-player="3"] { left: 35px; }
}

/* ==================== PAYSAGE MOBILE ==================== */
@media (max-height: 500px) and (orientation: landscape) {
  :root {
    --card-w: 52px; --card-h: 78px;
    --card-back-w: 32px; --card-back-h: 48px;
    --trick-offset: 40px;
    --hand-overlap: -12px;
  }
  #app { padding: 4px; gap: 4px; }
  .scores { padding: 4px; }
  .score-value { font-size: 1.1em; }
  .table { grid-template-columns: 80px 1fr 80px; grid-template-rows: 65px 1fr 115px; gap: 4px; }
  .seat-name { font-size: 0.6em; margin-bottom: 2px; }
  .actions { padding: 4px; min-height: 44px; }
  .btn { padding: 6px 10px; font-size: 0.75em; min-height: 36px; }
  .info-bar { padding: 4px 8px; font-size: 0.7em; }
  .trick-area { min-height: 120px; }
  .corner-rank { font-size: 14px; }
  .corner-suit { font-size: 12px; }
  .card-center { font-size: 24px; }
  .live-points { padding: 3px 8px; }
  .bid-action-toast { font-size: 0.7em; padding: 5px 12px; }
  .bid-action-toast[data-player="0"] { bottom: 125px; }
  .bid-action-toast[data-player="2"] { top: 70px; }
}

@media (hover: none) {
  .card.playable:hover { transform: none; box-shadow: 0 2px 8px rgba(0,0,0,0.35), 0 0 0 1px rgba(0,0,0,0.08) inset; }
  .btn:hover:not(:disabled) { transform: none; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ==================== CONSTANTS ====================
const SUITS = ['♠', '♥', '♦', '♣'];
const SUIT_NAMES = { '♠': 'Pique', '♥': 'Cœur', '♦': 'Carreau', '♣': 'Trèfle' };
const RANKS = ['7', '8', '9', '10', 'J', 'Q', 'K', 'A'];
const POINTS_NORMAL = { '7': 0, '8': 0, '9': 0, '10': 10, 'J': 2, 'Q': 3, 'K': 4, 'A': 11 };
const POINTS_TRUMP  = { '7': 0, '8': 0, '9': 14, '10': 10, 'J': 20, 'Q': 3, 'K': 4, 'A': 11 };
const ORDER_NORMAL = ['7', '8', '9', 'J', 'Q', 'K', '10', 'A'];
const ORDER_TRUMP  = ['7', '8', 'Q', 'K', '10', 'A', '9', 'J'];
const PLAYER_NAMES = ['Vous', 'Est', 'Nord', 'Ouest'];
const TEAM = [0, 1, 0, 1];
const TEAM_NAMES = ['Vous + Nord', 'Est + Ouest'];
const PARTNER = [2, 3, 0, 1];
const NEXT_PLAYER = [3, 0, 1, 2];

const TARGET_REAL = 1200;
const TARGET_DISPLAY = 120;

const BID_ORDER = ['♣', '♦', '♥', '♠', 'none', 'all'];
const BID_LABELS = { '♣': '♣ Trèfle', '♦': '♦ Carreau', '♥': '♥ Cœur', '♠': '♠ Pique', 'none': 'Sans atout', 'all': 'Tout atout' };
const LITIGE = { '♣': 81, '♦': 81, '♥': 81, '♠': 81, 'none': 65, 'all': 129 };
const CAPOT_BASE = 252;
const CAPOT_BONUS = 150;

// ==================== HELPERS ====================
function createDeck() {
  const d = [];
  for (const s of SUITS) for (const r of RANKS) d.push({ suit: s, rank: r });
  return d;
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function cardStrength(card, trump) {
  if (trump === 'all') return ORDER_TRUMP.indexOf(card.rank);
  if (trump === 'none' || !trump) return ORDER_NORMAL.indexOf(card.rank);
  return (card.suit === trump ? ORDER_TRUMP : ORDER_NORMAL).indexOf(card.rank);
}
function cardPoints(card, trump) {
  if (trump === 'all') return POINTS_TRUMP[card.rank];
  if (trump === 'none' || !trump) return POINTS_NORMAL[card.rank];
  return (card.suit === trump ? POINTS_TRUMP : POINTS_NORMAL)[card.rank];
}
function sortHand(hand, trump) {
  let order;
  if (trump === 'all' || trump === 'none' || !trump) order = SUITS;
  else order = [trump, ...SUITS.filter(s => s !== trump)];
  return [...hand].sort((a, b) => {
    if (a.suit !== b.suit) return order.indexOf(a.suit) - order.indexOf(b.suit);
    return cardStrength(a, trump) - cardStrength(b, trump);
  });
}

// ==================== FIND WINNER ====================
function findWinner(trick, trump) {
  if (!trick.length) return null;
  const leadSuit = trick[0].card.suit;
  let w = trick[0];

  if (trump === 'none') {
    for (let i = 1; i < trick.length; i++) {
      const c = trick[i];
      if (c.card.suit === leadSuit && ORDER_NORMAL.indexOf(c.card.rank) > ORDER_NORMAL.indexOf(w.card.rank)) w = c;
    }
    return w.player;
  }
  if (trump === 'all') {
    for (let i = 1; i < trick.length; i++) {
      const c = trick[i];
      if (c.card.suit === leadSuit && ORDER_TRUMP.indexOf(c.card.rank) > ORDER_TRUMP.indexOf(w.card.rank)) w = c;
    }
    return w.player;
  }
  for (let i = 1; i < trick.length; i++) {
    const c = trick[i];
    if (c.card.suit === w.card.suit) {
      const order = c.card.suit === trump ? ORDER_TRUMP : ORDER_NORMAL;
      if (order.indexOf(c.card.rank) > order.indexOf(w.card.rank)) w = c;
    } else if (c.card.suit === trump && w.card.suit !== trump) {
      w = c;
    }
  }
  return w.player;
}

// ==================== VALID MOVES ====================
function validMoves(hand, trick, trump, playerIdx) {
  if (!trick.length) return [...hand];
  const leadSuit = trick[0].card.suit;
  const sameSuit = hand.filter(c => c.suit === leadSuit);

  if (trump === 'none') return sameSuit.length ? sameSuit : [...hand];

  if (trump === 'all') {
    if (sameSuit.length) {
      const leadCards = trick.filter(t => t.card.suit === leadSuit);
      const highestInTrick = leadCards.reduce((m, t) => ORDER_TRUMP.indexOf(t.card.rank) > ORDER_TRUMP.indexOf(m.card.rank) ? t : m);
      const higher = sameSuit.filter(c => ORDER_TRUMP.indexOf(c.rank) > ORDER_TRUMP.indexOf(highestInTrick.card.rank));
      return higher.length ? higher : sameSuit;
    }
    return [...hand];
  }

  const trumps = hand.filter(c => c.suit === trump);
  if (sameSuit.length) {
    if (leadSuit === trump) {
      const trickTrumps = trick.filter(t => t.card.suit === trump);
      const highestInTrick = trickTrumps.reduce((m, t) => ORDER_TRUMP.indexOf(t.card.rank) > ORDER_TRUMP.indexOf(m.card.rank) ? t : m);
      const higher = sameSuit.filter(c => ORDER_TRUMP.indexOf(c.rank) > ORDER_TRUMP.indexOf(highestInTrick.card.rank));
      return higher.length ? higher : sameSuit;
    }
    return sameSuit;
  }
  if (!trumps.length) return [...hand];

  const winner = findWinner(trick, trump);
  if (winner === PARTNER[playerIdx]) return [...hand];

  const trickTrumps = trick.filter(t => t.card.suit === trump);
  if (!trickTrumps.length) return trumps;
  const highest = trickTrumps.reduce((m, t) => ORDER_TRUMP.indexOf(t.card.rank) > ORDER_TRUMP.indexOf(m.card.rank) ? t : m);
  const overTrumps = trumps.filter(c => ORDER_TRUMP.indexOf(c.rank) > ORDER_TRUMP.indexOf(highest.card.rank));
  return overTrumps.length ? overTrumps : trumps;
}

function trumpLabel(trump) {
  if (trump === 'none') return 'Sans atout';
  if (trump === 'all') return 'Tout atout';
  return SUIT_NAMES[trump] + ' ' + trump;
}

// ==================== STATE ====================
let S = {};
function resetState() {
  S = {
    hands: [[], [], [], []],
    reserveDeck: [],
    trump: null, taker: null, takerTeam: null, firstBidder: null, currentPlayer: 0,
    trick: [], trickNumber: 0,
    teamScores: [0, 0],
    phase: 'bidding',
    currentBid: null,
    bidPassCount: 0,
    multiplier: 1,
    lastTrickWinner: null, tricksWon: [[], [], [], []],
    roundPoints: [0, 0], belote: { K: false, Q: false, K_team: null, Q_team: null },
    roundOutcome: 'normal', roundWinner: null,
    roundOver: false, gameOver: false, aiTimer: null,
    trickResolved: false, animating: false,
    lastAction: null  // { text, player, ts }
  };
}

// ==================== LIVE POINTS (cumul temps réel) ====================
function getLivePoints() {
  const pts = [0, 0];
  for (let p = 0; p < 4; p++) {
    pts[TEAM[p]] += S.tricksWon[p].reduce((s, t) => s + t.points, 0);
  }
  return pts;
}

// ==================== BIDDING ====================
function canCounter(playerIdx) {
  const bid = S.currentBid;
  if (!bid) return false;
  if (bid.counterBy !== null && bid.counterBy !== undefined) return false;
  if (TEAM[playerIdx] === TEAM[bid.player]) return false;
  return true;
}
function canSurcounter(playerIdx) {
  const bid = S.currentBid;
  if (!bid) return false;
  if (bid.counterBy === null || bid.counterBy === undefined) return false;
  if (bid.surcounterBy !== null && bid.surcounterBy !== undefined) return false;
  if (TEAM[playerIdx] === TEAM[bid.counterBy]) return false;
  return true;
}
function isContred() {
  return S.currentBid && S.currentBid.counterBy !== null && S.currentBid.counterBy !== undefined;
}
function isSurcontred() {
  return S.currentBid && S.currentBid.surcounterBy !== null && S.currentBid.surcounterBy !== undefined;
}

function higherBids() {
  if (isContred()) return [];
  if (!S.currentBid) return [...BID_ORDER];
  const idx = BID_ORDER.indexOf(S.currentBid.suit);
  return BID_ORDER.slice(idx + 1);
}

function doBid(playerIdx, suit) {
  S.currentBid = { suit, player: playerIdx, counterBy: null, surcounterBy: null };
  S.bidPassCount = 0;
  if (S.firstBidder === null || S.firstBidder === undefined) S.firstBidder = playerIdx;
  showBidActionToast(`${PLAYER_NAMES[playerIdx]} → ${BID_LABELS[suit]}`, playerIdx);
  nextBidder();
}

function doCounter(playerIdx) {
  S.currentBid.counterBy = playerIdx;
  S.currentBid.surcounterBy = null;
  S.bidPassCount = 0;
  showBidActionToast(`${PLAYER_NAMES[playerIdx]} → Contre ×2`, playerIdx);
  nextBidder();
}

function doSurcounter(playerIdx) {
  S.currentBid.surcounterBy = playerIdx;
  S.bidPassCount = 0;
  showBidActionToast(`${PLAYER_NAMES[playerIdx]} → Surcontre ×4`, playerIdx);
  finalizeBid();
}

function doPass(playerIdx) {
  showBidActionToast(`${PLAYER_NAMES[playerIdx]} → Passe`, playerIdx);
  S.bidPassCount++;
  if (!S.currentBid) {
    if (S.bidPassCount >= 4) {
      showMessage('Tout le monde passe, nouvelle donne...');
      setTimeout(startRound, 1200);
      return;
    }
  } else {
    if (S.bidPassCount >= 3) {
      finalizeBid();
      return;
    }
  }
  nextBidder();
}

function nextBidder() {
  S.currentPlayer = NEXT_PLAYER[S.currentPlayer];
  render();
  if (S.currentPlayer !== 0) scheduleAI();
}

function finalizeBid() {
  const bid = S.currentBid;
  if (!bid) return;
  S.trump = bid.suit;
  S.taker = bid.player;
  S.takerTeam = TEAM[bid.player];

  if (bid.surcounterBy !== null && bid.surcounterBy !== undefined) S.multiplier = 4;
  else if (bid.counterBy !== null && bid.counterBy !== undefined) S.multiplier = 2;
  else S.multiplier = 1;

  S.phase = 'bidding-done';
  S.currentPlayer = -1;
  render();

  let label = `${PLAYER_NAMES[bid.player]} a pris ${trumpLabel(bid.suit)}`;
  if (S.multiplier === 2) label += ' — CONTRÉ ×2';
  if (S.multiplier === 4) label += ' — SURCONTRÉ ×4';
  showBidToast(label);

  setTimeout(() => {
    S.phase = 'playing';
    S.trickNumber = 1;
    S.currentPlayer = S.firstBidder !== null ? S.firstBidder : S.taker;
    S.trick = [];

    for (let i = 0; i < 12; i++) S.hands[i % 4].push(S.reserveDeck[i]);
    for (let i = 0; i < 4; i++) S.hands[i] = sortHand(S.hands[i], S.trump);

    render();
    if (S.currentPlayer !== 0) scheduleAI();
  }, 2000);
}

// ==================== GAME FLOW ====================
function newGame() { resetState(); startRound(); }

function startRound() {
  clearTimeout(S.aiTimer);
  S.hands = [[], [], [], []];
  S.reserveDeck = [];
  S.trump = null; S.taker = null; S.takerTeam = null; S.firstBidder = null;
  S.trick = []; S.trickNumber = 0;
  S.phase = 'bidding'; S.currentBid = null; S.bidPassCount = 0; S.multiplier = 1;
  S.tricksWon = [[], [], [], []]; S.roundPoints = [0, 0];
  S.belote = { K: false, Q: false, K_team: null, Q_team: null };
  S.roundOutcome = 'normal'; S.roundWinner = null;
  S.roundOver = false; S.trickResolved = false; S.lastTrickWinner = null; S.animating = false;

  const deck = shuffle(createDeck());
  S.reserveDeck = deck.slice(20);
  for (let i = 0; i < 20; i++) S.hands[i % 4].push(deck[i]);
  for (let i = 0; i < 4; i++) S.hands[i] = sortHand(S.hands[i], null);

  S.currentPlayer = Math.floor(Math.random() * 4);
  render();

  if (S.currentPlayer !== 0) scheduleAI();
  else showMessage('À vous d\'ouvrir les enchères');
}

// ==================== AI BID ====================
function aiBid(playerIdx) {
  const hand = S.hands[playerIdx];
  const bid = S.currentBid;

  function evalColor(color) {
    const trumps = hand.filter(c => c.suit === color);
    let score = 0, hasJ = false, has9 = false;
    for (const c of trumps) {
      if (c.rank === 'J')      { score += 10; hasJ = true; }
      else if (c.rank === '9') { score += 8;  has9 = true; }
      else if (c.rank === 'A') score += 5;
      else if (c.rank === '10')score += 4;
      else if (c.rank === 'K') score += 1;
    }
    for (const c of hand) {
      if (c.suit !== color) {
        if (c.rank === 'A')      score += 3;
        else if (c.rank === '10') score += 2;
      }
    }
    if (hasJ && has9)         score += 5;
    if (trumps.length === 0)  score -= 8;
    else if (trumps.length === 1) score -= 5;
    else if (trumps.length === 2) score -= 2;
    else if (trumps.length >= 4)  score += 2;
    return { score, trumps: trumps.length, hasJ, has9 };
  }
  function evalNone() {
    let score = 0;
    for (const c of hand) {
      if (c.rank === 'A')      score += 6;
      else if (c.rank === '10') score += 4;
      else if (c.rank === 'K')  score += 2;
      else if (c.rank === 'Q')  score += 1;
    }
    return { score };
  }
  function evalAll() {
    let score = 0, jCount = 0, nineCount = 0;
    for (const c of hand) {
      if (c.rank === 'J')      { score += 8; jCount++; }
      else if (c.rank === '9') { score += 6; nineCount++; }
      else if (c.rank === 'A') score += 3;
      else if (c.rank === '10')score += 2;
      else if (c.rank === 'K') score += 1;
    }
    if (jCount + nineCount < 2) score -= 8;
    return { score, jCount, nineCount };
  }

  const evals = {};
  for (const m of ['♣', '♦', '♥', '♠']) evals[m] = evalColor(m);
  evals['none'] = evalNone();
  evals['all']  = evalAll();

  if (bid && isContred()) {
    if (canSurcounter(playerIdx)) {
      const myEval = evals[bid.suit];
      let worthSurcounter = false;
      if (bid.suit === 'none') worthSurcounter = myEval.score >= 24;
      else if (bid.suit === 'all') worthSurcounter = myEval.jCount >= 2 && myEval.nineCount >= 1;
      else {
        const trumps = hand.filter(c => c.suit === bid.suit);
        worthSurcounter = trumps.length >= 4 && trumps.some(c => c.rank === 'J') && trumps.some(c => c.rank === '9');
      }
      if (worthSurcounter) { doSurcounter(playerIdx); return; }
    }
    doPass(playerIdx);
    return;
  }

  if (!bid) {
    let bestMode = '♣';
    let bestScore = -Infinity;
    for (const m of BID_ORDER) {
      const e = evals[m];
      if (m === 'all'  && e.score < 22) continue;
      if (m === 'none' && e.score < 18) continue;
      if (m !== 'all' && m !== 'none' && e.score < 15) continue;
      if (e.score > bestScore) { bestScore = e.score; bestMode = m; }
    }
    if (bestScore === -Infinity) {
      for (const m of BID_ORDER) {
        if (evals[m].score > bestScore) { bestScore = evals[m].score; bestMode = m; }
      }
    }
    doBid(playerIdx, bestMode);
    return;
  }

  const sameTeam = TEAM[playerIdx] === TEAM[bid.player];
  const myEval = evals[bid.suit];

  if (canCounter(playerIdx)) {
    let worthCounter = false;
    if (bid.suit === 'none') {
      const aces = hand.filter(c => c.rank === 'A').length;
      const tens = hand.filter(c => c.rank === '10').length;
      worthCounter = (aces + tens) >= 3;
    } else if (bid.suit === 'all') {
      worthCounter = (myEval.jCount + myEval.nineCount) >= 3;
    } else {
      const trumps = hand.filter(c => c.suit === bid.suit);
      const hasJ = trumps.some(c => c.rank === 'J');
      const has9 = trumps.some(c => c.rank === '9');
      worthCounter = trumps.length >= 3 || (trumps.length >= 2 && (hasJ || has9));
    }
    if (worthCounter && Math.random() < 0.55) { doCounter(playerIdx); return; }
  }

  if (!sameTeam) {
    const higher = higherBids();
    let bestRaise = null, bestRaiseScore = 0;
    for (const m of higher) {
      const e = evals[m];
      if (m === 'all' && (e.jCount + e.nineCount) < 2) continue;
      if (m === 'none' && e.score < 16) continue;
      if (m !== 'all' && m !== 'none') {
        const trumps = hand.filter(c => c.suit === m);
        const hasJ = trumps.some(c => c.rank === 'J');
        const has9 = trumps.some(c => c.rank === '9');
        if (trumps.length < 2) continue;
        if (trumps.length === 2 && !hasJ && !has9) continue;
      }
      if (e.score > bestRaiseScore) { bestRaiseScore = e.score; bestRaise = m; }
    }
    if (bestRaise && bestRaiseScore >= 20 && Math.random() < 0.35) {
      doBid(playerIdx, bestRaise);
      return;
    }
  }

  doPass(playerIdx);
}

// ==================== PLAY ====================
function playCard(playerIdx, card) {
  if (S.phase !== 'playing' || S.currentPlayer !== playerIdx) return;
  if (S.trick.length >= 4 || S.trickResolved) return;
  const hand = S.hands[playerIdx];
  const idx = hand.findIndex(c => c.suit === card.suit && c.rank === card.rank);
  if (idx === -1) return;
  const valid = validMoves(hand, S.trick, S.trump, playerIdx);
  if (!valid.some(c => c.suit === card.suit && c.rank === card.rank)) return;

  if (card.suit === S.trump) {
    if (card.rank === 'K') { S.belote.K = true; S.belote.K_team = TEAM[playerIdx]; }
    if (card.rank === 'Q') { S.belote.Q = true; S.belote.Q_team = TEAM[playerIdx]; }
  }

  hand.splice(idx, 1);
  S.trick.push({ player: playerIdx, card });
  S.currentPlayer = NEXT_PLAYER[playerIdx];

  if (S.trick.length === 4) {
    S.trickResolved = true;
    render();
    setTimeout(resolveTrick, 200);
    return;
  }
  render();
  if (S.currentPlayer !== 0) scheduleAI();
}

// ==================== ANIMATION ====================
function animateTrickToWinner(winnerPlayer) {
  const wraps = document.querySelectorAll('.trick-card-wrap');
  if (!wraps.length) return;
  const target = document.querySelector(`.trick-card-wrap[data-player="${winnerPlayer}"]`);
  if (!target) return;

  const targetRect = target.getBoundingClientRect();
  const tcx = targetRect.left + targetRect.width / 2;
  const tcy = targetRect.top + targetRect.height / 2;

  wraps.forEach(wrap => {
    const r = wrap.getBoundingClientRect();
    const dx = tcx - (r.left + r.width / 2);
    const dy = tcy - (r.top + r.height / 2);

    wrap.style.transition = 'translate 0.7s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.7s ease-in';

    if (wrap === target) {
      wrap.style.translate = '0 0';
      wrap.style.zIndex = '30';
    } else {
      wrap.style.translate = `${dx}px ${dy}px`;
      wrap.style.opacity = '0';
      wrap.style.zIndex = '25';
    }
  });
}

function resolveTrick() {
  if (S.animating) return;
  S.animating = true;

  const winner = findWinner(S.trick, S.trump);
  animateTrickToWinner(winner);

  setTimeout(() => {
    const pts = S.trick.reduce((sum, t) => sum + cardPoints(t.card, S.trump), 0);
    S.tricksWon[winner].push({ cards: [...S.trick], points: pts });
    S.lastTrickWinner = winner;
    S.trickNumber++;
    S.trickResolved = false;
    S.animating = false;

    if (S.trickNumber > 8) {
      S.trick = [];
      render();
      setTimeout(endRound, 800);
      return;
    }
    S.trick = [];
    S.currentPlayer = winner;
    render();
    if (S.currentPlayer !== 0) scheduleAI();
  }, 700);
}

// ==================== AI PLAY ====================
function aiChooseCard(playerIdx) {
  const hand = S.hands[playerIdx];
  const valid = validMoves(hand, S.trick, S.trump, playerIdx);
  if (!valid.length) return null;
  if (valid.length === 1) return valid[0];

  const position = S.trick.length;
  const currentW = findWinner(S.trick, S.trump);
  const partnerWins = currentW === PARTNER[playerIdx];

  const sorted = [...valid].sort((a, b) => cardStrength(a, S.trump) - cardStrength(b, S.trump));
  const nonTrumps = S.trump === 'all' ? [] : sorted.filter(c => c.suit !== S.trump);

  if (position === 0) return nonTrumps.length ? nonTrumps[0] : sorted[0];
  if (partnerWins) return nonTrumps.length ? nonTrumps[0] : sorted[0];

  const winningCards = valid.filter(card => {
    const simulated = [...S.trick, { player: playerIdx, card }];
    return findWinner(simulated, S.trump) === playerIdx;
  });

  if (winningCards.length) {
    return winningCards.sort((a, b) => cardStrength(a, S.trump) - cardStrength(b, S.trump))[0];
  }
  return nonTrumps.length ? nonTrumps[0] : sorted[0];
}

function aiPlay(playerIdx) {
  if (S.animating) return;
  const valid = validMoves(S.hands[playerIdx], S.trick, S.trump, playerIdx);
  if (!valid.length) return;
  const card = Math.random() < 0.15
    ? valid[Math.floor(Math.random() * valid.length)]
    : aiChooseCard(playerIdx);
  if (card) playCard(playerIdx, card);
}

function scheduleAI() {
  clearTimeout(S.aiTimer);
  const delay = S.phase === 'bidding' ? 1000 : 800;
  S.aiTimer = setTimeout(() => {
    if (S.animating) return;
    if (S.phase === 'bidding' && S.currentPlayer !== 0) aiBid(S.currentPlayer);
    else if (S.phase === 'playing' && S.currentPlayer !== 0 && !S.trickResolved) aiPlay(S.currentPlayer);
  }, delay);
}

// ==================== SCORING FINAL ====================
function endRound() {
  S.phase = 'scoring';

  const tricksCount = [0, 0];
  const pts = [0, 0];
  for (let p = 0; p < 4; p++) {
    const team = TEAM[p];
    tricksCount[team] += S.tricksWon[p].length;
    pts[team] += S.tricksWon[p].reduce((s, t) => s + t.points, 0);
  }
  pts[TEAM[S.lastTrickWinner]] += 10;
  if (S.belote.K && S.belote.Q && S.belote.K_team === S.belote.Q_team && S.belote.K_team !== null) {
    pts[S.belote.K_team] += 20;
  }

  const takerTeam = S.takerTeam;
  const oppTeam = 1 - takerTeam;
  const finalPoints = [0, 0];
  const mult = S.multiplier;
  const litige = LITIGE[S.trump];
  let outcome = 'normal';

  // CAPOT
  if (tricksCount[0] === 8 || tricksCount[1] === 8) {
    const capotTeam = tricksCount[0] === 8 ? 0 : 1;
    finalPoints[capotTeam] = (CAPOT_BASE + CAPOT_BONUS) * mult;
    finalPoints[1 - capotTeam] = 0;
    outcome = 'capot';
    S.roundWinner = capotTeam;

    if (capotTeam !== takerTeam) {
      S.gameOver = true;
      S.roundOutcome = 'dedans_capot';
      S.roundPoints = finalPoints;
      S.teamScores[0] += finalPoints[0];
      S.teamScores[1] += finalPoints[1];
      S.roundOver = true;
      render();
      return;
    }
  }
  // CONTRAT RÉUSSI
  else if (pts[takerTeam] > litige) {
    if (mult > 1) {
      // CONTRÉ / SURCONTRÉ réussi : seul le preneur marque TOUS les points
      const allPts = pts[0] + pts[1];
      finalPoints[takerTeam] = allPts * mult;
      finalPoints[oppTeam] = 0;
      S.roundWinner = takerTeam;
    } else {
      // Normal : chaque équipe marque ses points
      finalPoints[0] = pts[0];
      finalPoints[1] = pts[1];
      S.roundWinner = pts[0] > pts[1] ? 0 : (pts[1] > pts[0] ? 1 : -1);
    }
  }
  // DEDANS : l'adversaire gagne TOUS les points
  else {
    const allPts = pts[0] + pts[1];
    finalPoints[takerTeam] = 0;
    finalPoints[oppTeam] = allPts * mult;
    outcome = 'dedans';
    S.roundWinner = oppTeam;
  }

  S.teamScores[0] += finalPoints[0];
  S.teamScores[1] += finalPoints[1];

  if (S.teamScores[0] >= TARGET_REAL || S.teamScores[1] >= TARGET_REAL) S.gameOver = true;
  S.roundPoints = finalPoints;
  S.roundOutcome = outcome;
  S.roundOver = true;
  render();
}

function nextRound() {
  if (S.gameOver) { newGame(); return; }
  startRound();
}

// ==================== RENDER ====================
const app = document.getElementById('app');

function render() {
  app.innerHTML = `
    ${renderScores()}
    ${renderLivePoints()}
    ${renderTable()}
    ${renderActions()}
    ${renderInfo()}
    ${S.roundOver ? renderRoundOver() : ''}
    ${S.gameOver ? renderGameOver() : ''}
  `;
  attachHandlers();
}

function renderScores() {
  const w0 = S.teamScores[0] >= TARGET_REAL, w1 = S.teamScores[1] >= TARGET_REAL;
  const d0 = Math.round(S.teamScores[0] / 10);
  const d1 = Math.round(S.teamScores[1] / 10);
  return `
    <div class="scores">
      <div class="scores-row">
        <div class="score-item">
          <div class="score-team">${TEAM_NAMES[0]}</div>
          <div class="score-value ${w0 ? 'winning' : ''}">${d0}</div>
        </div>
        <div class="score-item">
          <div class="score-team">${TEAM_NAMES[1]}</div>
          <div class="score-value ${w1 ? 'winning' : ''}">${d1}</div>
        </div>
        <div class="score-item">
          <div class="score-team">Objectif</div>
          <div class="score-value" style="color:var(--gold);font-size:1.3em;">${TARGET_DISPLAY}</div>
        </div>
      </div>
    </div>
  `;
}

// === Nouveau : cumul de points en temps réel ===
function renderLivePoints() {
  if (S.phase !== 'playing' && S.phase !== 'scoring') return '';
  const pts = getLivePoints();
  const takerTeam = S.takerTeam;
  const c0 = (takerTeam === 0) ? 'taker' : '';
  const c1 = (takerTeam === 1) ? 'taker' : '';
  return `
    <div class="live-points">
      <div class="live-team">
        <span class="live-team-name">${TEAM_NAMES[0]}</span>
        <span class="live-team-pts ${c0}">${pts[0]}</span>
      </div>
      <span class="live-vs">·</span>
      <div class="live-team">
        <span class="live-team-pts ${c1}">${pts[1]}</span>
        <span class="live-team-name">${TEAM_NAMES[1]}</span>
      </div>
    </div>
  `;
}

function renderTable() {
  const isFinal = S.trick.length === 4;
  const trickWinner = isFinal ? findWinner(S.trick, S.trump) : null;

  return `
    <div class="table">
      <div class="seat seat-north">
        <div class="seat-name ${S.currentPlayer === 2 && S.phase === 'playing' ? 'active' : ''}">Nord</div>
        <div class="hand-hidden">${S.hands[2].map(() => '<div class="card-back"></div>').join('')}</div>
      </div>
      <div class="seat seat-west">
        <div class="seat-name ${S.currentPlayer === 3 && S.phase === 'playing' ? 'active' : ''}">Ouest</div>
        <div class="hand-hidden">${S.hands[3].map(() => '<div class="card-back"></div>').join('')}</div>
      </div>
      <div class="seat seat-east">
        <div class="seat-name ${S.currentPlayer === 1 && S.phase === 'playing' ? 'active' : ''}">Est</div>
        <div class="hand-hidden">${S.hands[1].map(() => '<div class="card-back"></div>').join('')}</div>
      </div>

      <div class="trick-area">
        <div class="trick-cards">
          ${S.trick.map((t, i) => {
            const isLast = i === S.trick.length - 1;
            const isWinner = trickWinner === t.player;
            return `
              <div class="trick-card-wrap ${isLast ? 'just-played' : ''} ${isWinner ? 'winner' : ''}" data-player="${t.player}">
                <div class="trick-card-anim">
                  <div class="trick-card-owner">${PLAYER_NAMES[t.player]}</div>
                  ${renderCard(t.card, false, t)}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>

      <div class="seat seat-south">
        <div class="seat-name ${S.currentPlayer === 0 && S.phase === 'playing' ? 'active' : ''}">Vous</div>
        <div class="hand-visible" id="human-hand">
          ${S.hands[0].map(c => renderCard(c, true, null)).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderCard(card, inHand, trickEntry) {
  const isRed = card.suit === '♥' || card.suit === '♦';
  let cls = 'card';
  if (isRed) cls += ' red';

  if (inHand && S.phase === 'playing' && S.currentPlayer === 0 && !S.trickResolved) {
    const valid = validMoves(S.hands[0], S.trick, S.trump, 0);
    const ok = valid.some(c => c.suit === card.suit && c.rank === card.rank);
    cls += ok ? ' playable' : ' disabled';
  } else if (inHand && S.trickResolved) {
    cls += ' disabled';
  }

  return `
    <div class="${cls}" data-suit="${card.suit}" data-rank="${card.rank}">
      <div class="card-corner card-corner-tl">
        <span class="corner-rank">${card.rank}</span>
        <span class="corner-suit">${card.suit}</span>
      </div>
      <div class="card-center">${card.suit}</div>
      <div class="card-corner card-corner-br">
        <span class="corner-rank">${card.rank}</span>
        <span class="corner-suit">${card.suit}</span>
      </div>
    </div>
  `;
}

function renderActions() {
  if (S.gameOver) return `<div class="actions"><button class="btn btn-primary" onclick="newGame()">Rejouer</button></div>`;
  if (S.roundOver) return `<div class="actions"><button class="btn btn-primary" onclick="nextRound()">Continuer</button></div>`;

  if (S.phase === 'bidding-done') {
    return `<div class="actions"><div style="color:var(--gold);font-weight:700;">Enchère validée, distribution en cours...</div></div>`;
  }

  if (S.phase === 'bidding' && S.currentPlayer === 0) {
    return renderBiddingActions();
  }
  if (S.phase === 'bidding') return `<div class="actions"><div style="color:var(--text-2)">${PLAYER_NAMES[S.currentPlayer]} réfléchit...</div></div>`;
  if (S.phase === 'playing' && S.currentPlayer === 0 && !S.trickResolved) return `<div class="actions"><div style="color:var(--accent-2);font-weight:600;">À vous de jouer !</div></div>`;
  if (S.phase === 'playing' && S.trickResolved) return `<div class="actions"><div style="color:var(--gold);font-weight:600;">Fin du pli...</div></div>`;
  if (S.phase === 'playing') return `<div class="actions"><div style="color:var(--text-2)">${PLAYER_NAMES[S.currentPlayer]} joue...</div></div>`;
  return '';
}

function renderBiddingActions() {
  const bid = S.currentBid;
  const contred = isContred();
  const higher = higherBids();
  const buttons = [];

  if (!contred) {
    for (const m of higher) {
      const isRed = m === '♥' || m === '♦';
      buttons.push(`<button class="btn btn-bid ${isRed ? 'red' : ''}" onclick="handleBidClick('${m}')">${BID_LABELS[m]}</button>`);
    }
    if (canCounter(0)) {
      buttons.push(`<button class="btn btn-counter" onclick="handleCounterClick()">Contrer ×2</button>`);
    }
  }

  if (contred && canSurcounter(0)) {
    buttons.push(`<button class="btn btn-surcounter" onclick="handleSurcounterClick()">Surcontrer ×4</button>`);
  }

  if (bid) {
    buttons.push(`<button class="btn" onclick="handlePassClick()">Passer</button>`);
  }

  let hint;
  if (!bid) hint = 'Vous devez annoncer une couleur (premier enchérisseur)';
  else if (contred) hint = `Enchère CONTRÉE : ${BID_LABELS[bid.suit]} par ${PLAYER_NAMES[bid.player]}`;
  else hint = `Enchère actuelle : ${BID_LABELS[bid.suit]} par ${PLAYER_NAMES[bid.player]}`;

  return `
    <div class="actions">
      <div style="width:100%;text-align:center;color:var(--text-2);font-size:0.85em;">${hint}</div>
      ${buttons.join('')}
    </div>`;
}

function renderInfo() {
  if (S.gameOver || S.roundOver) return '';
  let info = '';

  if (S.phase === 'bidding') {
    info += `<strong>Enchères</strong>`;
    if (S.currentBid) {
      let badge = '';
      if (isSurcontred()) badge = ' <span class="bid-surcounter">SURCONTRÉ ×4</span>';
      else if (isContred()) badge = ' <span class="bid-counter">CONTRÉ ×2</span>';
      info += ` • <span class="bid-current">${BID_LABELS[S.currentBid.suit]}</span> par <strong>${PLAYER_NAMES[S.currentBid.player]}</strong>${badge}`;
    }
  } else if (S.phase === 'bidding-done') {
    info += `<strong>Enchère validée</strong>`;
  } else if (S.phase === 'playing') {
    info += `Atout : <strong>${trumpLabel(S.trump)}</strong>`;
    info += ` • Litige : <strong>${LITIGE[S.trump]} pts</strong>`;
    info += ` • Preneur : <strong>${PLAYER_NAMES[S.taker]}</strong>`;
    if (S.multiplier > 1) info += ` • <strong>×${S.multiplier}</strong>`;
    info += ` • Pli ${Math.min(S.trickNumber, 8)}/8`;
  }
  return `<div class="info-bar">${info}</div>`;
}

function renderRoundOver() {
  let badge = '';
  let explanation = '';
  if (S.roundOutcome === 'capot') {
    badge = `<div class="outcome-badge capot">🎯 CAPOT !</div>`;
    explanation = `<div class="detail" style="color:var(--gold);">${TEAM_NAMES[S.roundWinner]} a remporté les 8 plis (+15 bonus)</div>`;
  } else if (S.roundOutcome === 'dedans') {
    badge = `<div class="outcome-badge dedans">❌ DEDANS !</div>`;
    explanation = `<div class="detail" style="color:var(--red);">${TEAM_NAMES[S.takerTeam]} échoue → ${TEAM_NAMES[S.roundWinner]} gagne TOUS les points</div>`;
  } else if (S.roundOutcome === 'dedans_capot') {
    badge = `<div class="outcome-badge dedans">❌ DEDANS CAPOT !</div>`;
    explanation = `<div class="detail" style="color:var(--red);">${TEAM_NAMES[S.takerTeam]} a fait dedans avec capot adverse</div>`;
  } else if (S.multiplier > 1) {
    badge = `<div class="outcome-badge capot">💰 CONTRÉ ×${S.multiplier}</div>`;
    explanation = `<div class="detail" style="color:var(--gold);">${TEAM_NAMES[S.takerTeam]} réussit le contrat contrés → ${TEAM_NAMES[S.takerTeam]} prend TOUS les points</div>`;
  }

  const dPts0 = Math.round(S.roundPoints[0] / 10);
  const dPts1 = Math.round(S.roundPoints[1] / 10);
  const dTotal0 = Math.round(S.teamScores[0] / 10);
  const dTotal1 = Math.round(S.teamScores[1] / 10);

  return `
    <div class="overlay">
      <div class="overlay-content">
        <h2>Fin de la manche</h2>
        ${badge}
        ${explanation}
        <div class="detail" style="margin-top:12px;">${TEAM_NAMES[0]} : <strong>+${dPts0} pts</strong></div>
        <div class="detail">${TEAM_NAMES[1]} : <strong>+${dPts1} pts</strong></div>
        <div class="detail" style="margin-top:12px;">Total : <strong>${dTotal0} - ${dTotal1}</strong> / ${TARGET_DISPLAY}</div>
        <button class="btn btn-primary" onclick="nextRound()">Continuer</button>
      </div>
    </div>`;
}

function renderGameOver() {
  const w = S.teamScores[0] >= TARGET_REAL ? 0 : (S.teamScores[1] >= TARGET_REAL ? 1 : S.roundWinner);
  const isCapotDedans = S.roundOutcome === 'dedans_capot';
  const d0 = Math.round(S.teamScores[0] / 10);
  const d1 = Math.round(S.teamScores[1] / 10);
  return `
    <div class="overlay">
      <div class="overlay-content">
        <h2>🏆 Partie terminée</h2>
        ${isCapotDedans ? '<div class="outcome-badge dedans" style="margin-bottom:10px;">DEDANS CAPOT !</div>' : ''}
        <div class="detail" style="font-size:1.3em;color:var(--gold);margin:12px 0;"><strong>${TEAM_NAMES[w]}</strong> gagne !</div>
        <div class="detail">Score final : ${d0} - ${d1} / ${TARGET_DISPLAY}</div>
        <button class="btn btn-primary" onclick="newGame()">Rejouer</button>
      </div>
    </div>`;
}

function attachHandlers() {
  if (S.phase === 'playing' && S.currentPlayer === 0 && !S.trickResolved) {
    document.querySelectorAll('#human-hand .card.playable').forEach(el => {
      el.addEventListener('click', () => playCard(0, { suit: el.dataset.suit, rank: el.dataset.rank }));
    });
  }
}

function handleBidClick(mode) {
  if (S.phase !== 'bidding' || S.currentPlayer !== 0) return;
  doBid(0, mode);
}
function handlePassClick() {
  if (S.phase !== 'bidding' || S.currentPlayer !== 0) return;
  doPass(0);
}
function handleCounterClick() {
  if (S.phase !== 'bidding' || S.currentPlayer !== 0) return;
  doCounter(0);
}
function handleSurcounterClick() {
  if (S.phase !== 'bidding' || S.currentPlayer !== 0) return;
  doSurcounter(0);
}

function showMessage(text) {
  document.querySelectorAll('.message').forEach(m => m.remove());
  const msg = document.createElement('div');
  msg.className = 'message';
  msg.textContent = text;
  document.body.appendChild(msg);
  setTimeout(() => msg.remove(), 2200);
}

// === Toast d'enchère positionné par joueur ===
function showBidActionToast(text, playerIdx) {
  document.querySelectorAll('.bid-action-toast').forEach(m => m.remove());
  const toast = document.createElement('div');
  toast.className = 'bid-action-toast';
  toast.setAttribute('data-player', playerIdx);
  toast.textContent = text;
  document.body.appendChild(toast);
  setTimeout(() => {
    toast.style.transition = 'opacity 0.3s';
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 300);
  }, 900);
}

function showBidToast(text) {
  document.querySelectorAll('.bid-toast').forEach(m => m.remove());
  const toast = document.createElement('div');
  toast.className = 'bid-toast';
  toast.textContent = text;
  document.body.appendChild(toast);
  setTimeout(() => toast.classList.add('fade-out'), 1800);
  setTimeout(() => toast.remove(), 2200);
}

newGame();
</script>
</body>
</html>
